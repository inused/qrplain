<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>QRPlain · 本地二维码</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <header><div><h1>QRPlain · 本地二维码</h1><p>离线生成二维码，读取图片内容。</p></div><button id="quit" class="secondary" type="button">退出程序</button></header>
    <div class="workspace">
      <section aria-labelledby="content-title">
        <label id="content-title" for="text">内容</label>
        <textarea id="text" spellcheck="false" placeholder="输入正文，或打开图片识别内容。"></textarea>
        <p id="count" class="hint">0 个 UTF-8 字节</p>
        <div class="settings">
          <label for="size">图片尺寸（像素）<input id="size" type="number" min="1" max="4096" value="512" step="1"></label>
          <label for="level">纠错等级<select id="level"><option value="L">L · 容量优先</option><option value="M" selected>M · 默认</option><option value="Q">Q · 较高纠错</option><option value="H">H · 最高纠错</option></select></label>
        </div>
        <div class="actions"><button id="generate" type="button">生成二维码</button><button id="upload" class="secondary" type="button">打开图片识别</button><input id="file" type="file" accept="image/png,image/jpeg,.png,.jpg,.jpeg" hidden></div>
        <p class="hint">图片支持 PNG、JPEG，最大 16 MiB、16,777,216 像素。长内容建议使用 768 或 1024 像素。</p>
      </section>
      <section class="preview" aria-labelledby="preview-title">
        <h2 id="preview-title">图片预览</h2>
        <div id="image-frame"><p id="empty">生成或打开图片后在这里预览</p><img id="image" alt="二维码预览" hidden></div>
        <button id="save" class="secondary" type="button" disabled>保存生成的 PNG</button>
        <p id="detail" class="hint">修改正文或参数后，请重新生成再保存。</p>
      </section>
    </div>
    <p id="status" role="status" aria-live="polite">就绪</p>
    <footer>关闭标签页会保留进程；点击“退出程序”结束服务。</footer>
  </main>
</body>
</html>
